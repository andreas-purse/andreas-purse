<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Andreas Purse. Product design engineer who builds with AI.">
  <defs>
    <pattern id="m" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#123563" stroke-width="1"/></pattern>
    <pattern id="M" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#m)"/><path d="M100 0H0V100" fill="none" stroke="#1b4580" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ffb703"/></marker>
  </defs>
  <style>
    .z{font:600 11px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#8fb3e6;text-anchor:middle}
    .ticks line{stroke:#8fb3e6;stroke-width:1}
    .name{font:700 76px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#eaf2ff;letter-spacing:-1.5px}
    .tag{font:500 22px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#eaf2ff}
    .acc{fill:#ffb703}
    .sub{font:500 14px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#8fb3e6;letter-spacing:2px}
    .cur{fill:#ffb703;animation:blink 1.1s steps(1) infinite}
    .edge{fill:none;stroke:#eaf2ff;stroke-width:2}
    .thin{stroke-width:1.2;opacity:.7}
    .ring{fill:none;stroke:#ffb703;stroke-width:1.5;stroke-dasharray:6 8}
    .spin{transform-origin:800px 160px;animation:spin 24s linear infinite}
    .cl{stroke:#8fb3e6;stroke-width:1;stroke-dasharray:18 4 3 4}
    .dim{stroke:#ffb703;stroke-width:1.2}
    .ext{stroke:#8fb3e6;stroke-width:.8}
    .lbl-bg{fill:#0b2545}
    .dimt{font:600 11px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#ffb703;text-anchor:middle;letter-spacing:1px}
    .tb rect,.tb line{fill:none;stroke:#8fb3e6;stroke-width:1}
    .tbt{font:600 9.5px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#eaf2ff;letter-spacing:.5px}
    .lead{stroke:#ffb703;stroke-width:1.2;fill:none}
    .fade{opacity:0;animation:in .9s ease-out forwards}
    .d1{animation-delay:.15s} .d2{animation-delay:.45s} .d3{animation-delay:.75s}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="1200" height="360" fill="#0b2545"/>
  <rect x="40" y="40" width="1120" height="280" fill="url(#M)"/>
  <rect x="10" y="10" width="1180" height="340" fill="none" stroke="#8fb3e6" stroke-width="1"/>
  <rect x="40" y="40" width="1120" height="280" fill="none" stroke="#8fb3e6" stroke-width="2"/>
  <g class="ticks"><line x1="320" y1="30" x2="320" y2="40"/><line x1="320" y1="320" x2="320" y2="330"/><line x1="600" y1="30" x2="600" y2="40"/><line x1="600" y1="320" x2="600" y2="330"/><line x1="880" y1="30" x2="880" y2="40"/><line x1="880" y1="320" x2="880" y2="330"/></g>
  <text x="180" y="27" class="z">1</text><text x="180" y="343" class="z">1</text><text x="460" y="27" class="z">2</text><text x="460" y="343" class="z">2</text><text x="740" y="27" class="z">3</text><text x="740" y="343" class="z">3</text><text x="1020" y="27" class="z">4</text><text x="1020" y="343" class="z">4</text><text x="23" y="90" class="z">A</text><text x="1177" y="90" class="z">A</text><text x="23" y="183" class="z">B</text><text x="1177" y="183" class="z">B</text><text x="23" y="276" class="z">C</text><text x="1177" y="276" class="z">C</text>

  <text x="90" y="112" class="sub">PRODUCT DESIGN ENGINEER</text>
  <text x="84" y="190" class="name">Andreas Purse</text>
  <text x="90" y="238" class="tag"><tspan class="acc">&gt;</tspan> I build things with AI.<tspan class="cur">▍</tspan></text>
  <text x="90" y="290" class="sub">HARDWARE · SOFTWARE · BRAND</text>
  <path d="M610 284 H680 L742 218" class="lead"/>
  <circle cx="640" cy="284" r="3" class="acc"/>
  
  <g class="part">
    <circle cx="800" cy="160" r="78" class="edge"/>
    <circle cx="800" cy="160" r="52" class="edge thin"/>
    <circle cx="800" cy="160" r="9" class="edge"/>
    <g class="spin"><circle cx="800" cy="160" r="94" class="ring"/></g>
    <line x1="688" y1="160" x2="912" y2="160" class="cl"/>
    <line x1="800" y1="48" x2="800" y2="272" class="cl"/>
    <line x1="722" y1="284" x2="878" y2="284" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="722" y1="164" x2="722" y2="292" class="ext"/>
    <line x1="878" y1="164" x2="878" y2="292" class="ext"/>
    <rect x="748" y="274" width="104" height="20" class="lbl-bg"/>
    <text x="800" y="288" class="dimt">Ø IDEA → BUILD</text>
  </g>
  
  <g class="tb">
    <rect x="960" y="262" width="200" height="58"/>
    <line x1="960" y1="282" x2="1160" y2="282"/>
    <line x1="960" y1="301" x2="1160" y2="301"/>
    <line x1="1052" y1="282" x2="1052" y2="320"/>
    <text x="968" y="276" class="tbt">DWG AP-001 · ANDREAS PURSE</text>
    <text x="968" y="295" class="tbt">REV 2026.10</text>
    <text x="1060" y="295" class="tbt">SCALE 1:1</text>
    <text x="968" y="314" class="tbt">LBORO · PDE</text>
    <text x="1060" y="314" class="tbt">MATL: CLAUDE</text>
  </g>
</svg>
